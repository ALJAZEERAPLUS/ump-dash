# ump-dash configuration
# Copy to ~/.config/ump-dash/config.toml and fill in your values.
# File permissions are set to 0600 (contains credentials).

# Absolute path to the UMP React Native monorepo root (supports ~/).
# Required.
repo_root = "~/code/my-rn-app"

# Base URL for your JIRA instance.
# Required for JIRA integration.
jira_base_url = "https://your-org.atlassian.net"

# JIRA account email.
# Required for Cloud auth mode, unused for Data Center.
jira_email = "you@example.com"

# JIRA API token (Cloud) or Personal Access Token (Data Center).
jira_token = "your-api-token-here"

# Authentication mode.
# Possible values:
#   "cloud"      -> Basic Auth using jira_email + jira_token
#   "datacenter" -> Bearer auth using jira_token as a PAT
# Default: "cloud"
# auth_mode = "cloud"

# JIRA project key prefix used in branch names (e.g., "PROJ" for PROJ-1234).
# Default: "UMP"
# jira_project_prefix = "UMP"

# Title shown in the dashboard header.
# Default: "UMP Dash"
# app_title = "UMP Dash"

# Flags passed when launching Claude Code.
# Default: "--dangerously-skip-permissions"
# claude_flags = "--dangerously-skip-permissions"

# Editor opened from the Open palette with o>e.
# Default: "vim"
# editor = "vim"

# When true, o>e opens a terminal surface at the selected worktree and runs
# "<editor> .". When false, ump-dash runs "<editor> <absolute-worktree-path>"
# as an external command. For GUI Emacs, use:
# editor = "emacsclient -c -n"
# editor_in_terminal = false
# Default: true
# editor_in_terminal = true

# Automatically accept sync-before-run and sync-before-metro prompts.
# Possible values: true, false
# Default: false
# auto_sync = false

# Spinner glyph set for live task indicators:
# Possible values:
#   "circles" -> half-circles ◐◓◑◒ (default)
#   "braille" -> braille dots ⠋⠙⠹⠸⠼⠴ (guaranteed single-cell width; use if the
#                half-circles don't line up under the Y/P letters in your terminal)
#   "dots"    -> alias for "braille"
# Default: "circles"
# spinner_style = "circles"

# Worktree table columns, in display order.
# Possible values:
#   "status" -> Yarn/pod freshness icons
#   "branch" -> Git branch name
#   "ticket" -> JIRA ticket key + title
#   "dir"    -> Worktree directory name
#   "task"   -> Running task spinner + label + elapsed time
#   "cache_status"         -> iOS native cache availability
#   "cache"                -> iOS native cache fingerprint
#   "android_cache_status" -> Android native cache availability
#   "android_cache"        -> Android native cache fingerprint
# Omit a value to hide that column. Widths are fixed by ump-dash.
# Default: ["status", "branch", "ticket", "dir", "task", "cache_status", "cache"]
# columns = ["status", "branch", "ticket", "dir", "task", "android_cache_status", "android_cache"]

# Native build cache artifact storage.
# Omit this setting to keep metadata only and reference the original .app/APK
# output path. Set it to copy cached artifacts under a stable local root.
# In both modes, ump-dash records a SHA-256 digest and treats changed artifacts
# as cache misses instead of reusing stale outputs.
# native_cache_artifact_root = "~/Library/Caches/ump-dash/native-artifacts"
